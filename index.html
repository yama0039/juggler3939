<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ジャグラー実践データ</title>

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- CSS -->
<link rel="stylesheet" href="style.css">
</head>
<body>

<h1>🎰 ジャグラー記録</h1>

<div class="card">

<input id="play_date" type="date">
<input id="store" placeholder="店名">
<input id="machine" placeholder="機種名">
<input id="number" type="number" inputmode="numeric" placeholder="台番号">
<input id="games" type="number" inputmode="numeric" placeholder="総回転数">

<h3>🎯 ボーナス</h3>
<div class="grid2">
  <input id="bb_single" type="number" placeholder="単独BB">
  <input id="bb_cherry" type="number" placeholder="🍒BB">
  <input id="rb_single" type="number" placeholder="単独RB">
  <input id="rb_cherry" type="number" placeholder="🍒RB">
</div>

<h3>🍇 小役</h3>
<div class="grid2">
  <input id="grape" type="number" placeholder="ブドウ">
  <input id="cherry" type="number" placeholder="チェリー">
</div>

<button onclick="saveData()">保存</button>

</div>

<div class="tableWrap">
<table>
<thead>
<tr>
  <th>日付</th>
  <th>台</th>
  <th>回転</th>
  <th>BB</th>
  <th>RB</th>
  <th>合算</th>
  <th>🍇</th>
  <th>🍒</th>
  <th></th>
</tr>
</thead>
<tbody id="dataList"></tbody>
</table>
</div>

<!-- JS（Supabaseより後に読み込む） -->
<script src="script.js"></script>

</body>
</html>
