<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ジャグラー実践データ管理</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="style.css">

</head>
<body>

<h1>🎰 ジャグラー実践データ管理</h1>

<div class="form">
  <input id="play_date" type="date">
  <input id="store" placeholder="店名">
  <input id="machine" placeholder="機種名">
  <input id="number" type="number" placeholder="台番号">
  <input id="games" type="number" placeholder="総回転数">

  <h3>🎯 ボーナス</h3>
  <input id="bb_single" type="number" placeholder="単独BB">
  <input id="bb_cherry" type="number" placeholder="チェリーBB">
  <input id="rb_single" type="number" placeholder="単独RB">
  <input id="rb_cherry" type="number" placeholder="チェリーRB">

  <h3>🍇 小役</h3>
  <input id="grape" type="number" placeholder="ブドウ">
  <input id="cherry" type="number" placeholder="チェリー">

  <button onclick="saveData()">保存</button>
</div>

<h2>📊 データ一覧</h2>
<table>
<thead>
<tr>
  <th>日付</th>
  <th>店</th>
  <th>機種</th>
  <th>台</th>
  <th>回転</th>
  <th>BB</th>
  <th>RB</th>
  <th>合算</th>
  <th>🍇</th>
  <th>🍒</th>
  <th>削除</th>
</tr>
</thead>
<tbody id="dataList"></tbody>
</table>

</body>
</html>
